[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 이름에 해시가 붙는 빌드 결과물과 모델 파일은 오래 캐시한다
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
